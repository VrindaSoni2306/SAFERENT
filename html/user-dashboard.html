<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard | SafeRent</title>

    <link rel="stylesheet" href="../css/user-dashboardstyle.css">
    <link rel="stylesheet" href="../css/responsive1.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>

    <!-- sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <h1>SafeRent</h1>
        </div>

        <nav class="sidebar-nav">

            <a href="user-dashboard.html" class="nav-item active">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>

            <a href="#" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>

            <a href="#" class="nav-item">
                <i class="fa-solid fa-heart"></i>
                <span>Favorites</span>
            </a>

            <a href="#" class="nav-item">
                <i class="fa-solid fa-calendar-check"></i>
                <span>My Bookings</span>
            </a>

            <a href="#" class="nav-item">
                <i class="fa-solid fa-star"></i>
                <span>Reviews</span>
            </a>

            <a href="#" class="nav-item">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>Complaints</span>
            </a>

            <a href="#" class="nav-item logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>

        </nav>

    </aside>


    <!-- main -->

    <main class="main-content">


        <!-- topbar -->

        <header class="topbar">

            <div class="dashboard-title">
                <h2>User Dashboard</h2>
            </div>


            <!-- Search bar-->

            <div class="search-box">

                <input
                    type="text"
                    placeholder="Search properties..."
                >

                <button type="button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>


            <!-- Right Side -->

            <div class="topbar-right">

                <!-- Notification -->

                <div class="notification">

                    <i class="fa-solid fa-bell"></i>

                    <span class="notification-count">
                        3
                    </span>

                </div>


                <!-- User -->

                <div class="user-profile">

                    <div class="profile-circle">
                        V
                    </div>

                    <div class="user-info">

                        <h4>Vanshdeep</h4>

                        <span>User</span>

                    </div>

                </div>

            </div>

        </header>


        <!--welcome -->

        <section class="welcome-card">

            <div class="welcome-content">

                <h1>
                    Welcome Back, Vanshdeep
                    <span>👋</span>
                </h1>

                <p>
                    Manage your bookings, favorites, reviews and profile
                    from your dashboard.
                </p>

            </div>


            <div class="welcome-action">

                <a href="#" class="booking-btn">
                    <i class="fa-solid fa-plus"></i>
                    New Booking
                </a>

            </div>

        </section>


    </main>


    <!-- JavaScript -->
    <script src="../js/script1.js"></script>

</body>

</html>
