<!DOCTYPE html>
<html>
<head>
    <title>Owner Dashboard</title>
    <link rel="stylesheet" href="../css/owner-dashboard.css">
</head>

<body>

    <div class="sidebar">

        <h2>SafeRent</h2>

        <ul>
            <li>Dashboard</li>
            <li>My Properties</li>
            <li>Add Property</li>
            <li>Verification</li>
        </ul>

    </div>

    <div class="content">

        <h1>Owner Dashboard</h1>

        <div class="cards">

            <div class="card">
                <h2>12</h2>
                <p>Properties</p>
            </div>

            <div class="card">
                <h2>28</h2>
                <p>Bookings</p>
            </div>

            <div class="card">
                <h2>85%</h2>
                <p>Occupancy</p>
            </div>

            <div class="card">
                <h2>4.8</h2>
                <p>Rating</p>
            </div>

        </div>

        <h2>My Properties</h2>

        <div class="property">

            <h3>Sunshine PG</h3>

            <p>₹8500/month</p>

            <button>Edit</button>

            <button>Delete</button>

        </div>

        <h2>Add Property</h2>

        <form>

            <input type="text" placeholder="Property Name">

            <input type="text" placeholder="City">

            <input type="number" placeholder="Rent">

            <input type="file">

            <button>Save</button>

        </form>

        <h2>Verification</h2>

        <div class="verification">

            <p>Aadhaar ✓</p>

            <p>PAN ✓</p>

            <p>Property Document ⏳</p>

        </div>

    </div>

    <script src="../js/owner-dashboard.js"></script>

</body>
</html>
