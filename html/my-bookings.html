<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Bookings - SafeRent</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/my-bookings.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">
        <span>SafeRent</span>
    </div>

    <nav class="sidebar-nav">

        <a href="user-dashboard.html" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Dashboard</span>
        </a>

        <a href="profile.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>

        <a href="favorites.html" class="nav-item">
            <i class="fa-solid fa-heart"></i>
            <span>Favorites</span>
        </a>

        <a href="my-bookings.html" class="nav-item active">
            <i class="fa-solid fa-calendar-check"></i>
            <span>My Bookings</span>
        </a>

        <a href="my-reviews.html" class="nav-item">
            <i class="fa-solid fa-star"></i>
            <span>Reviews</span>
        </a>

        <a href="complaints.html" class="nav-item">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>Complaints</span>
        </a>

       <a href="#" class="nav-item logout" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>

    </nav>

</aside>


<!-- ================= MAIN CONTENT ================= -->

<main class="main-content">

    <!-- TOPBAR -->

    <header class="topbar">

        <div class="dashboard-title">
            <h2>My Bookings</h2>
        </div>

        <div class="search-box">

            <input type="text" placeholder="Search properties...">

            <button type="button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

        </div>

        <div class="topbar-right">

            <div class="notification">

                <i class="fa-solid fa-bell"></i>

                <span class="notification-count">3</span>

            </div>

            <div class="user-profile">

                <div class="profile-circle">
                    V
                </div>

                <div class="user-info">

                    <h4>Vanshdeep</h4>
                    <span>User</span>

                </div>

            </div>

        </div>

    </header>


    <!-- ================= BOOKINGS ================= -->

    <section class="bookings-page" id="bookingsPage">

        <div class="bookings-header">

            <div>
                <h2>My Bookings</h2>
                <p>View and manage your property bookings</p>
            </div>

            <div class="booking-count" id="bookingCount">
                <i class="fa-solid fa-calendar-check"></i>
                <span>2 Bookings</span>
            </div>

        </div>


        <div id="bookingList"></div>


        <!-- EMPTY BOOKING SECTION -->

        <div class="no-bookings" id="noBookings">

            <i class="fa-solid fa-calendar-xmark"></i>

            <h3>No More Bookings</h3>

            <p>
                Your upcoming and previous bookings will appear here.
            </p>

        </div>

    </section>

</main>

<script>

    function logout() {

        localStorage.removeItem("isLoggedIn");
        localStorage.removeItem("currentUser");

        window.location.href = "login-register.html";
    }


    function loadMyBookings() {

        var currentUser =
            JSON.parse(localStorage.getItem("currentUser"));

        var bookingList =
            document.getElementById("bookingList");

        var noBookings =
            document.getElementById("noBookings");

        var bookingCount =
            document.getElementById("bookingCount");

        var bookings =
            JSON.parse(localStorage.getItem("bookings")) || [];

        var myBookings = [];

        if (currentUser !== null) {

            for (var i = 0; i < bookings.length; i++) {

                if (bookings[i].userEmail === currentUser.email) {

                    myBookings.push(bookings[i]);
                }
            }
        }

        bookingCount.innerHTML =
            "<i class='fa-solid fa-calendar-check'></i>" +
            "<span>" + myBookings.length + " Bookings</span>";

        if (myBookings.length === 0) {

            noBookings.style.display = "block";

            return;
        }

        noBookings.style.display = "none";
        bookingList.innerHTML = "";

        for (var j = 0; j < myBookings.length; j++) {

            var booking = myBookings[j];

            bookingList.innerHTML +=
                "<div class='booking-card'>" +
                "<div class='booking-details'>" +
                "<div class='booking-title'>" +
                "<h3>" + booking.propertyName + "</h3>" +
                "<span><i class='fa-solid fa-location-dot'></i>" + booking.location + "</span>" +
                "</div>" +
                "<div class='booking-info'>" +
                "<div><i class='fa-solid fa-calendar'></i><div><small>Move-in</small><strong>" + booking.moveInDate + "</strong></div></div>" +
                "<div><i class='fa-solid fa-bed'></i><div><small>Duration</small><strong>" + booking.duration + "</strong></div></div>" +
                "<div><i class='fa-solid fa-user'></i><div><small>People</small><strong>" + booking.numberOfPeople + "</strong></div></div>" +
                "</div>" +
                "<div class='booking-bottom'><strong>" + booking.status + "</strong></div>" +
                "</div>" +
                "</div>";
        }
    }


    loadMyBookings();

</script>

</body>
</html>
